<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monitor de Salud</title>
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="stylesheet" href="./css/index.css" />
</head>

<body>
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0;">
        <a href="profile.html" class="button">Perfil</a>
        <a href="admin.html" id="admin-panel-btn" class="button">Panel Admin</a>
        <!-- Boton para cerrar sesion -->
        <button id="logout-btn">Cerrar Sesión</button>
    </div>

    <h1>Monitor de Salud</h1>

    <!-- NUEVA SECCIÓN: Solo para Cuidadores -->
    <div id="carer-section">
        <label for="patient-select" style="font-weight: bold;">Seleccionar Paciente Asignado:</label>
        <select id="patient-select" style="margin-left: 10px; padding: 5px;">
            <option value="">-- Seleccione un paciente --</option>
        </select>
    </div>

    <h2 id="monitor-title">Última medición</h2>
    <div id="last-record">Cargando...</div>

    <h2>Historial</h2>
    <div class="table-container">
        <table border="1">
            <thead>
                <tr>
                    <th>Fecha y Hora</th>
                    <th>Frecuencia cardíaca (BPM)</th>
                    <th>Saturación de oxígeno</th>
                    <th>Caída</th>
                </tr>
            </thead>
            <tbody id="table-record"></tbody>
        </table>
    </div>

    <canvas id="healthChart"></canvas>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/js/index.js"></script>
</body>

</html>
